name: Deploy Zarathustra Web IDE to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'zarathustra/web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    defaults:
      run:
        working-directory: zarathustra/web
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.ZEROTOKEN }}
          vercel-org-id: ${{ secrets.VERCELID }}
          vercel-project-id: ${{ secrets.PROJECTID }}
          working-directory: zarathustra/web
          vercel-args: '--prod'
